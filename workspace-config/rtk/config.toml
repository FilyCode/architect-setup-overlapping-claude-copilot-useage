# rtk config — hand-authored 2026-08-25. The real file lives in this repo;
# ~/.config/rtk/config.toml is a symlink to it, matching workspace-config/rules and
# workspace-config/agents. A missing OR unparseable config makes rtk fall back to rewriting
# EVERYTHING with no warning of any kind, so it must not sit unversioned in a quota-capped home.
#
# POLICY: allowlist. Only `cat` is rewritten (to `rtk read`). Everything else runs raw.
#
# Why, from the usage DB (~/.local/share/rtk/history.db, 36,449 commands):
#   - median saving per call is 0 tokens; 61% of calls saved nothing, 82% saved under 100
#   - the top 10 calls are 91% of all lifetime savings
#   - `rtk find`'s entire 1136.9M is ONE call, `find / -name '*'` (2026-07-22, 99.8% of it);
#     the other 770 find calls saved 0.1M combined
#   - `rtk grep` saved 12.0M over 6,954 calls (0.6%) while being the biggest corruption source
# So routine compaction buys ~nothing, and the real wins were two pathological commands
# (`find /`, `cat` on a multi-GB database) that should be BOUNDED, not compressed.
#
# `cat` is kept because `rtk read` is the only adapter both verified faithful (byte-identical
# to /usr/bin/cat across tabs, unicode, 5000-char lines, and a missing trailing newline) and
# carrying recurring value — 5 of the 10 biggest savings are `cat` on huge database files, and
# rtk read truncates those *with disclosure*.
#
# Failure modes this replaces (all reproduced on rtk 0.39.0, all silent, all exit 0):
#   grep -v/-vn/-nv  returned MATCHING lines instead of non-matching (-v eaten as rtk verbosity)
#   grep -h/-hn      printed rtk's usage banner, 0 matches
#   grep -l 5 a b    -l/-m/-t are value-taking rtk options that swallow the next token
#   diff A B         exit 1 became exit 0, inverting `diff a b && ...` gates
#   git log          silently injects --no-merges, dropping merges and backfilling the count
#   find / tree      omit hidden AND gitignored paths, misreporting their own total as complete
# Detail: .claude/rules/verification.md   Harness: software/bin/rtk_selftest.sh

[hooks]
exclude_commands = [
  # ALLOWLIST, expressed as exclusions because rtk has no include_commands.
  # These four patterns together match every command whose name is not exactly `cat`.
  # Written this way rather than as a list of the 53 adapters rtk currently ships, so that any
  # adapter a FUTURE rtk release adds is excluded automatically instead of silently opting in.
  # NOTE these are single-quoted TOML *literal* strings. A basic "..." string rejects \s as an
  # invalid escape, and an unparseable config silently restores ZERO exclusions — that exact
  # mistake was made and caught while writing this file.
  '^[^c]',       # anything not starting with c
  '^c[^a]',      # curl, cd, chmod, cp, cargo's cousins, ...
  '^ca[^t]',     # cargo, cabal, ...
  '^cat[^\s]',   # catx, catalina, ... (bare `cat` and `cat <args>` survive)
]

[filters]
# Only affects `rtk tree`, which is no longer hook-mediated. Kept close to upstream defaults.
ignore_dirs = [".git", "node_modules", "target", "__pycache__", ".venv"]
ignore_files = ["*.lock", "*.min.js", "*.min.css"]

[tracking]
enabled = true
history_days = 90

[display]
colors = true
emoji = true
max_width = 120

[tee]
enabled = true
mode = "failures"
max_files = 20
max_file_size = 1048576

[telemetry]
enabled = false
